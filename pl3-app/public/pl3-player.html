<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排列三开奖直播</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  video { width: 100%; height: 100%; object-fit: contain; }
  .msg { color: #aaa; font-size: 14px; text-align: center; position: absolute; }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div class="msg" id="msg">正在获取直播源...</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  var video = document.getElementById('video');
  var msg = document.getElementById('msg');

  video.addEventListener('click', function() { video.muted = false; });

  function startStream(programId) {
    msg.textContent = '正在获取直播流...';
    fetch('https://api.ivideo.sina.com.cn/public/live/play?appname=sinaplayer_pc&appver=1&applt=web&program_token=' + programId + '&ran=' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.code !== 1 || !data.data || !data.data.streams) {
          msg.textContent = '直播未开始';
          return;
        }
        var streams = data.data.streams;
        var hlsStream = null, flvStream = null;
        for (var i = 0; i < streams.length; i++) {
          if (streams[i].protocol === 'hls') hlsStream = streams[i].address;
          if (streams[i].protocol === 'flv') flvStream = streams[i].address;
        }
        var url = hlsStream || flvStream;
        if (!url) { msg.textContent = '直播未开始'; return; }
        msg.style.display = 'none';
        if (hlsStream && Hls.isSupported()) {
          var hls = new Hls();
          hls.loadSource(hlsStream);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.muted = false;
            video.play().catch(function() { video.muted = true; video.play(); });
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = hlsStream || flvStream;
          video.muted = false;
          video.play().catch(function() { video.muted = true; video.play(); });
        } else if (flvStream) {
          video.src = flvStream;
          video.muted = false;
          video.play().catch(function() { video.muted = true; video.play(); });
        }
      })
      .catch(function() { msg.textContent = '获取直播流失败'; });
  }

  // 自动从新浪官网获取最新 PROGRAM_ID
  fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://sports.sina.com.cn/lottery/video/tcopen/'))
    .then(function(r) { return r.text(); })
    .then(function(html) {
      var match = html.match(/program_id:\s*['"](\d+)['"]/);
      if (match && match[1]) {
        startStream(match[1]);
      } else {
        msg.textContent = '无法获取直播源配置';
      }
    })
    .catch(function() { msg.textContent = '获取直播源失败'; });
</script>
</body>
</html>
