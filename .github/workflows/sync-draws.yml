name: sync-draws

on:
  schedule:
    # ⚠ GitHub Actions 的 cron 只认 UTC，平台不提供任何时区参数，无法直接写北京时间。
    #   下面每一行都在注释里标出对应的北京时间（= UTC + 8 小时）。
    # 开奖时间：福彩3D 北京 21:15、排列三 北京 21:25（= UTC 13:15 / 13:25）
    #
    # 为何铺这么密：实测 2026-09-08 的两个 cron（UTC 13:30 / 14:05）分别延迟 5h01m / 4h50m
    #   才执行（实际跑在北京时间次日 02:31 / 02:55），导致当晚开奖数据要到凌晨才上线；
    #   2026-09-09 更彻底——到 UTC 15:07 为止当天 cron 一次都没被触发。
    #   把触发点从 UTC 08:13 起每 30 分钟铺到 16:13，则无论 GitHub 延迟 0~5 小时，
    #   都至少有一次执行落在开奖之后。这是“兜底”，不是唯一通道，见下方 push 触发。
    # 避开 :00 与 :30：GitHub 官方明确整点属高负载时段、定时任务会被进一步延迟，故错开到 :13 / :43。
    # 成本：公开仓库的 Actions 分钟数免费不限量，17 次/天无额度压力。
    - cron: '13 8 * * *'    # 北京 16:13
    - cron: '43 8 * * *'    # 北京 16:43
    - cron: '13 9 * * *'    # 北京 17:13
    - cron: '43 9 * * *'    # 北京 17:43
    - cron: '13 10 * * *'   # 北京 18:13
    - cron: '43 10 * * *'   # 北京 18:43
    - cron: '13 11 * * *'   # 北京 19:13
    - cron: '43 11 * * *'   # 北京 19:43
    - cron: '13 12 * * *'   # 北京 20:13
    - cron: '43 12 * * *'   # 北京 20:43
    - cron: '13 13 * * *'   # 北京 21:13（福彩3D 21:15 开奖前，通常无新数据）
    - cron: '43 13 * * *'   # 北京 21:43（两个彩种均已开奖 ← 关键时间点）
    - cron: '13 14 * * *'   # 北京 22:13
    - cron: '43 14 * * *'   # 北京 22:43
    - cron: '13 15 * * *'   # 北京 23:13
    - cron: '43 15 * * *'   # 北京 23:43
    - cron: '13 16 * * *'   # 北京 次日 00:13
  workflow_dispatch:
  # 【可靠通道】push 事件在本仓库实测 100% 触发（pages-deploy 连续 4 次成功），
  #   而上面的 schedule 实测会延迟 5 小时甚至整天不跑。因此每次推送代码时也顺带同步一次数据，
  #   本机执行 sync-push.bat 推送数据同样会走这条通道。
  # paths-ignore 排除两个数据文件本身：自动同步产生的提交只含这两个文件，
  #   GitHub 判定“全部变更文件均被忽略”即不触发，从而避免“同步 → 提交 → 再同步”的无限循环。
  push:
    branches: [main, master]
    paths-ignore:
      - 'lottery-app/src/data/lotteryData.js'
      - 'pl3-app/src/data/lotteryData.js'

# contents: write      —— 允许把新开奖数据提交回仓库
# pages: write + id-token: write —— 允许在**同一次运行内**直接构建并发布 Pages。
#   为什么必须自己发布：用仓库默认 GITHUB_TOKEN 推送产生的事件不会触发任何其他工作流
#   （GitHub 为防递归而设的硬规则，workflow_dispatch / repository_dispatch 除外）。
#   实测后果：bot 的三次数据提交 5e1058a（09-10 21:34）、09212f4（09-11 21:32）、
#   fb9b731（09-11 21:49）全都没有触发 pages-deploy —— 该工作流历史 8 次运行的 head_sha
#   无一例外都是人工提交。数据进了仓库，线上站点却从 09-09 23:42 起一直停在 26242 期，
#   直到 09-11 22:23 一次人工代码推送才顺带把两期数据带上线。
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一个同步任务，避免两次 cron 重叠写入。
# 注意：下面 deploy 作业另用 group「pages-deploy」，与 pages-deploy.yml 的 workflow 级
#   concurrency 同名，从而让人工推送触发的发布与本工作流的发布互相排队、不会同时部署。
concurrency:
  group: sync-draws
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 把「本次是否真的有新数据」交给 deploy 作业判断，无新数据就不必白构建一次
    outputs:
      data_changed: ${{ steps.commit.outputs.data_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取完整历史：默认 fetch-depth:1 是浅克隆，后面的 git pull --rebase
          # 在浅历史上可能因找不到共同祖先而失败，导致数据同步上了却推不上去
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync latest draw results into repo
        run: node scripts/gh_sync_draws.mjs

      # if: !cancelled() —— 上一步只要发现异常就会以退出码 1 失败（健康信号），
      #   但那时可能已有一个应用成功写入数据；本步仍需执行，把已同步部分推上去不丢数据。
      # job 最终仍为 failure（因为同步步骤红了），健康信号不会被掩盖
      - name: Commit and push if data changed
        id: commit
        if: ${{ !cancelled() }}
        env:
          # 直接用 github.ref_name 而不是 git rev-parse --abbrev-ref HEAD：
          # 后者在分离头指针状态下会返回字面量 HEAD，使 git push origin HEAD:HEAD 失败
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lottery-app/src/data/lotteryData.js pl3-app/src/data/lotteryData.js
          if git diff --cached --quiet; then
            echo "无新开奖数据，不提交"
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): 自动同步最新开奖数据"
            # 推送前先变基，避免与人工提交冲突导致推送失败
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ==================== 发布作业 ====================
  # 数据一变就在本运行内把 Pages 构建发布掉，彻底不依赖 push 事件（bot 推送触发不了别的工作流）。
  deploy:
    needs: sync
    # !cancelled() —— sync 作业可能因健康信号（数据源异常）被判定为 failure，
    #   但那时数据往往已经提交成功，仍必须发布，否则线上会一直落后一期。
    if: ${{ !cancelled() && needs.sync.outputs.data_changed == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # 只需 vite build，跳过 Electron 二进制下载
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须显式取分支最新提交：schedule 事件下 github.sha 是排队时的默认分支 HEAD，
          #   **不包含** sync 作业刚推上去的那条数据提交，照它构建等于把旧数据又发一遍。
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build 福彩3D
        run: |
          cd lottery-app
          npm ci
          npm run build

      - name: Build 排列三
        run: |
          cd pl3-app
          npm ci
          npm run build

      - name: Assemble pages (3d + pl3 + launcher)
        run: |
          mkdir -p pages/3d pages/pl3
          cp -r lottery-app/dist/. pages/3d/
          cp -r pl3-app/dist/. pages/pl3/
          cp pages-index.html pages/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
