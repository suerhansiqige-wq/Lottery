name: sync-draws

on:
  schedule:
    # ⚠ GitHub Actions 的 cron 只认 UTC，平台不提供任何时区参数，无法直接写北京时间。
    #   下面每一行都在注释里标出对应的北京时间（= UTC + 8 小时）。
    # 开奖时间：福彩3D 北京 21:15、排列三 北京 21:25（= UTC 13:15 / 13:25）
    #
    # 为何铺这么密：实测 2026-09-08 的两个 cron（UTC 13:30 / 14:05）分别延迟 5h01m / 4h50m
    #   才执行（实际跑在北京时间次日 02:31 / 02:55），导致当晚开奖数据要到凌晨才上线；
    #   2026-09-09 更彻底——到 UTC 15:07 为止当天 cron 一次都没被触发。
    #   把触发点从 UTC 08:13 起每 30 分钟铺到 16:13，则无论 GitHub 延迟 0~5 小时，
    #   都至少有一次执行落在开奖之后。这是“兜底”，不是唯一通道，见下方 push 触发。
    # 避开 :00 与 :30：GitHub 官方明确整点属高负载时段、定时任务会被进一步延迟，故错开到 :13 / :43。
    # 成本：公开仓库的 Actions 分钟数免费不限量，17 次/天无额度压力。
    - cron: '13 8 * * *'    # 北京 16:13
    - cron: '43 8 * * *'    # 北京 16:43
    - cron: '13 9 * * *'    # 北京 17:13
    - cron: '43 9 * * *'    # 北京 17:43
    - cron: '13 10 * * *'   # 北京 18:13
    - cron: '43 10 * * *'   # 北京 18:43
    - cron: '13 11 * * *'   # 北京 19:13
    - cron: '43 11 * * *'   # 北京 19:43
    - cron: '13 12 * * *'   # 北京 20:13
    - cron: '43 12 * * *'   # 北京 20:43
    - cron: '13 13 * * *'   # 北京 21:13（福彩3D 21:15 开奖前，通常无新数据）
    - cron: '43 13 * * *'   # 北京 21:43（两个彩种均已开奖 ← 关键时间点）
    - cron: '13 14 * * *'   # 北京 22:13
    - cron: '43 14 * * *'   # 北京 22:43
    - cron: '13 15 * * *'   # 北京 23:13
    - cron: '43 15 * * *'   # 北京 23:43
    - cron: '13 16 * * *'   # 北京 次日 00:13
  workflow_dispatch:
  # 【可靠通道】push 事件在本仓库实测 100% 触发（pages-deploy 连续 4 次成功），
  #   而上面的 schedule 实测会延迟 5 小时甚至整天不跑。因此每次推送代码时也顺带同步一次数据，
  #   本机执行 sync-push.bat 推送数据同样会走这条通道。
  # paths-ignore 排除两个数据文件本身：自动同步产生的提交只含这两个文件，
  #   GitHub 判定“全部变更文件均被忽略”即不触发，从而避免“同步 → 提交 → 再同步”的无限循环。
  push:
    branches: [main, master]
    paths-ignore:
      - 'lottery-app/src/data/lotteryData.js'
      - 'pl3-app/src/data/lotteryData.js'

# 允许工作流把新开奖数据提交回仓库（Pages 随之重新发布，延续性由仓库保证）
permissions:
  contents: write

# 同一时间只跑一个同步任务，避免两次 cron 重叠写入
concurrency:
  group: sync-draws
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取完整历史：默认 fetch-depth:1 是浅克隆，后面的 git pull --rebase
          # 在浅历史上可能因找不到共同祖先而失败，导致数据同步上了却推不上去
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync latest draw results into repo
        run: node scripts/gh_sync_draws.mjs

      # if: !cancelled() —— 上一步只要发现异常就会以退出码 1 失败（健康信号），
      # 但那时可能已有一个应用成功写入数据；本步仍需执行，把已同步部分推上去不丢数据。
      # job 最终仍为 failure（因为同步步骤红了），健康信号不会被掩盖
      - name: Commit and push if data changed
        if: ${{ !cancelled() }}
        env:
          # 直接用 github.ref_name 而不是 git rev-parse --abbrev-ref HEAD：
          # 后者在分离头指针状态下会返回字面量 HEAD，使 git push origin HEAD:HEAD 失败
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lottery-app/src/data/lotteryData.js pl3-app/src/data/lotteryData.js
          if git diff --cached --quiet; then
            echo "无新开奖数据，不提交"
          else
            git commit -m "chore(data): 自动同步最新开奖数据"
            # 推送前先变基，避免与人工提交冲突导致推送失败
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
