name: sync-draws

on:
  schedule:
    # UTC 13:40 = 北京 21:40（福彩3D 21:15、排列三 21:25 开奖后）
    - cron: '40 13 * * *'
    # UTC 14:10 = 北京 22:10 兜底补同步
    - cron: '10 14 * * *'
  workflow_dispatch:

# 允许工作流把新开奖数据提交回仓库（Pages 随之重新发布，延续性由仓库保证）
permissions:
  contents: write

# 同一时间只跑一个同步任务，避免两次 cron 重叠写入
concurrency:
  group: sync-draws
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync latest draw results into repo
        run: node scripts/gh_sync_draws.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lottery-app/src/data/lotteryData.js pl3-app/src/data/lotteryData.js
          if git diff --cached --quiet; then
            echo "无新开奖数据，不提交"
          else
            git commit -m "chore(data): 自动同步最新开奖数据"
            BRANCH="$(git rev-parse --abbrev-ref HEAD)"
            # 推送前先变基，避免与人工提交冲突导致推送失败
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
